<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 260" role="img" aria-label="Амба — тигрёнок-летописец">
  <title>Амба — тигрёнок-летописец</title>
  <defs>
    <radialGradient id="fur" cx="50%" cy="40%" r="65%">
      <stop offset="0" stop-color="#F5A03C"/><stop offset="1" stop-color="#D9701C"/>
    </radialGradient>
    <radialGradient id="cap" cx="45%" cy="35%" r="70%">
      <stop offset="0" stop-color="#D4392F"/><stop offset="1" stop-color="#8E1C16"/>
    </radialGradient>
    <linearGradient id="scroll" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#F6EAD0"/><stop offset="1" stop-color="#DCC394"/>
    </linearGradient>
  </defs>
  <style>
    .amba-tail { transform-box: fill-box; transform-origin: 12% 45%; animation: tail-wave 3.8s ease-in-out infinite; }
    .amba-cap { transform-box: fill-box; transform-origin: 50% 100%; animation: cap-tilt 5.2s ease-in-out infinite; }
    .amba-eyes { transform-box: fill-box; transform-origin: 50% 50%; animation: blink 6.4s ease-in-out infinite; }
    .amba-quill { transform-box: fill-box; transform-origin: 20% 90%; animation: feather-bob 3.4s ease-in-out infinite; }
    .amba-scroll { transform-box: fill-box; transform-origin: 45% 85%; animation: scroll-bob 4.6s ease-in-out infinite; }
    .amba-ear { transform-box: fill-box; transform-origin: 50% 80%; }
    .amba-ear-left { animation: ear-twitch 7s ease-in-out 1.2s infinite; }
    .amba-ear-right { animation: ear-twitch 8s ease-in-out 3.7s infinite; }
    .amba-cheek { animation: cheek-glow 3.2s ease-in-out infinite; }
    .amba-cap-gem { transform-box: fill-box; transform-origin: center; animation: gem-flash 3.8s ease-in-out infinite; }
    @keyframes tail-wave { 0%,72%,100% { transform: rotate(0); } 80% { transform: rotate(9deg); } 88% { transform: rotate(-5deg); } 94% { transform: rotate(3deg); } }
    @keyframes cap-tilt { 0%,100% { transform: rotate(0); } 50% { transform: rotate(-1.5deg); } }
    @keyframes blink { 0%,46%,49%,93%,96%,100% { transform: scaleY(1); } 47.5%,94.5% { transform: scaleY(.08); } }
    @keyframes feather-bob { 0%,100% { transform: rotate(-1deg); } 50% { transform: rotate(3deg); } }
    @keyframes scroll-bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
    @keyframes ear-twitch { 0%,84%,100% { transform: rotate(0); } 88% { transform: rotate(-7deg); } 93% { transform: rotate(4deg); } }
    @keyframes cheek-glow { 0%,100% { opacity: .42; } 50% { opacity: .72; } }
    @keyframes gem-flash { 0%,86%,100% { filter: brightness(1); } 90% { filter: brightness(1.8); } 94% { filter: brightness(1.1); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; } }
  </style>
  <!-- хвост -->
  <path class="amba-tail" d="M168 214 C 214 214, 226 176, 204 160 C 194 153, 186 162, 194 170 C 206 182, 196 198, 170 198 Z" fill="url(#fur)" stroke="#3A2414" stroke-width="3" stroke-linejoin="round"/>
  <path d="M204 162 l-8 10 M214 178 l-12 4 M206 196 l-10 -6" stroke="#2A1A10" stroke-width="4" stroke-linecap="round"/>
  <!-- тело -->
  <ellipse cx="120" cy="196" rx="62" ry="50" fill="url(#fur)" stroke="#3A2414" stroke-width="3"/>
  <ellipse cx="120" cy="206" rx="36" ry="34" fill="#FFF4E2"/>
  <path d="M64 186 q10 4 14 14 M60 206 q12 2 16 12 M176 186 q-10 4 -14 14 M180 206 q-12 2 -16 12" stroke="#2A1A10" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- свиток в левой лапе -->
  <g class="amba-scroll">
    <rect x="58" y="196" width="58" height="34" rx="4" fill="url(#scroll)" stroke="#7A5A30" stroke-width="2.5" transform="rotate(-8 87 213)"/>
    <ellipse cx="58" cy="216" rx="6" ry="19" fill="#E9D5A8" stroke="#7A5A30" stroke-width="2.5" transform="rotate(-8 87 213)"/>
    <path d="M70 206 h34 M70 214 h30 M70 222 h24" stroke="#B3261E" stroke-width="2.4" stroke-linecap="round" transform="rotate(-8 87 213)"/>
  </g>
  <!-- лапы -->
  <ellipse cx="86" cy="234" rx="20" ry="13" fill="#FFF4E2" stroke="#3A2414" stroke-width="3"/>
  <ellipse cx="154" cy="234" rx="20" ry="13" fill="#FFF4E2" stroke="#3A2414" stroke-width="3"/>
  <path d="M80 230 v8 M88 229 v9 M148 230 v8 M156 229 v9" stroke="#3A2414" stroke-width="2.4" stroke-linecap="round"/>
  <!-- перо в правой лапе -->
  <g class="amba-quill">
    <path d="M150 212 C 170 170, 196 140, 222 118 C 214 150, 192 184, 158 214 Z" fill="#FFFDF7" stroke="#3A2414" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M154 212 L 216 126" stroke="#B9A27A" stroke-width="2"/>
    <path d="M150 212 l-6 12 l10 -8 z" fill="#B3261E" stroke="#3A2414" stroke-width="2"/>
    <circle cx="160" cy="206" r="13" fill="url(#fur)" stroke="#3A2414" stroke-width="3"/>
  </g>
  <!-- уши -->
  <circle class="amba-ear amba-ear-left" cx="66" cy="62" r="22" fill="url(#fur)" stroke="#3A2414" stroke-width="3"/>
  <circle class="amba-ear amba-ear-right" cx="174" cy="62" r="22" fill="url(#fur)" stroke="#3A2414" stroke-width="3"/>
  <circle cx="68" cy="64" r="11" fill="#FFF4E2"/>
  <circle cx="172" cy="64" r="11" fill="#FFF4E2"/>
  <!-- голова -->
  <ellipse cx="120" cy="104" rx="70" ry="62" fill="url(#fur)" stroke="#3A2414" stroke-width="3"/>
  <!-- полосы на голове: знак «王» на лбу -->
  <path d="M106 74 h28 M110 84 h20 M104 94 h32 M120 70 v26" stroke="#2A1A10" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M52 92 q14 2 20 10 M50 110 q14 0 22 8 M188 92 q-14 2 -20 10 M190 110 q-14 0 -22 8" stroke="#2A1A10" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- щёки-баки -->
  <path d="M56 124 C 60 150, 92 166, 120 166 C 148 166, 180 150, 184 124 C 170 134, 150 132, 120 132 C 90 132, 70 134, 56 124 Z" fill="#FFF4E2"/>
  <ellipse cx="120" cy="128" rx="34" ry="24" fill="#FFF4E2"/>
  <!-- глаза -->
  <g class="amba-eyes">
    <ellipse cx="94" cy="106" rx="11" ry="13" fill="#2A1A10"/>
    <ellipse cx="146" cy="106" rx="11" ry="13" fill="#2A1A10"/>
    <circle cx="98" cy="101" r="4" fill="#fff"/>
    <circle cx="150" cy="101" r="4" fill="#fff"/>
    <circle cx="91" cy="111" r="1.8" fill="#fff"/>
    <circle cx="143" cy="111" r="1.8" fill="#fff"/>
  </g>
  <path class="amba-brows" d="M82 90 q12 -6 22 0 M136 90 q12 -6 22 0" stroke="#2A1A10" stroke-width="3" fill="none" stroke-linecap="round" opacity="0"/>
  <!-- румянец -->
  <ellipse class="amba-cheek" cx="76" cy="128" rx="10" ry="6" fill="#F28B82" opacity=".55"/>
  <ellipse class="amba-cheek" cx="164" cy="128" rx="10" ry="6" fill="#F28B82" opacity=".55"/>
  <!-- нос и рот -->
  <path d="M110 120 q10 -6 20 0 q-2 8 -10 11 q-8 -3 -10 -11 z" fill="#6B3A2A"/>
  <path class="amba-mouth-happy" d="M120 131 v5 M108 138 q6 7 12 -2 q6 9 12 2" stroke="#3A2414" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path class="amba-mouth-sad" d="M120 131 v5 M108 144 q12 -8 24 0" stroke="#3A2414" stroke-width="3" fill="none" stroke-linecap="round" opacity="0"/>
  <!-- усы -->
  <path d="M84 132 h-24 M84 138 l-22 6 M156 132 h24 M156 138 l22 6" stroke="#3A2414" stroke-width="2" stroke-linecap="round" opacity=".7"/>
  <!-- мурмолка: старорусская шапка с меховой опушкой -->
  <g class="amba-cap">
    <path d="M78 52 C 78 14, 104 2, 126 6 C 150 10, 166 30, 162 52 Z" fill="url(#cap)" stroke="#3A2414" stroke-width="3" stroke-linejoin="round"/>
    <path d="M92 20 q18 -8 40 2" stroke="#E8B04B" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M96 34 l6 -6 l6 6 l-6 6 z M132 34 l6 -6 l6 6 l-6 6 z M114 26 l6 -6 l6 6 l-6 6 z" fill="#E8B04B"/>
    <rect x="70" y="46" width="100" height="18" rx="9" fill="#7A4E2D" stroke="#3A2414" stroke-width="3"/>
    <path d="M80 54 q4 -4 8 0 q4 4 8 0 q4 -4 8 0 q4 4 8 0 q4 -4 8 0 q4 4 8 0 q4 -4 8 0 q4 4 8 0 q4 -4 8 0 q4 4 8 0" stroke="#A9774B" stroke-width="2" fill="none"/>
    <circle class="amba-cap-gem" cx="128" cy="6" r="6" fill="#E8B04B" stroke="#3A2414" stroke-width="2.5"/>
  </g>
</svg>
